name: Release

# A version tag builds the program as the Arch packages do and attaches it to the tag's GitHub
# release, for the -bin packages to install.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: >
          pacman -Syu --noconfirm --needed
          gcc pkgconf cmake ninja git zstd wlroots0.20 wayland wayland-protocols wlr-protocols libxkbcommon
          pango cairo pam libcanberra libpulse polkit-qt6 qt6-base qt6-svg qt6-wayland layer-shell-qt lua shared-mime-info
      # libtde is not in the Arch repositories; built and installed from its sources.
      - name: Install libtde
        run: |
          git clone --depth 1 https://github.com/zskamljic/libtde.git /tmp/libtde
          cmake -S /tmp/libtde -B /tmp/libtde/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build /tmp/libtde/build
          cmake --install /tmp/libtde/build
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
      - name: Test
        run: QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          DESTDIR="$PWD/pkg" cmake --install build
          tar --zstd -C pkg -cf "tde-session-${GITHUB_REF_NAME#v}-x86_64.tar.zst" .
      - uses: softprops/action-gh-release@v2
        with:
          files: tde-session-*-x86_64.tar.zst
