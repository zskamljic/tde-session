# xdg-desktop-portal in TDE: files are picked in Ariadne, screenshots and colours on the screen
# in Argus, the screen is shared by the wlroots portal, and the rest is left to GTK's portals.
[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=tde;gtk
org.freedesktop.impl.portal.Screenshot=tde-argus;wlr
org.freedesktop.impl.portal.ScreenCast=wlr
