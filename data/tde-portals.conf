# xdg-desktop-portal in TDE: files are picked in Ariadne, pictures and recordings of the screen
# are taken by the wlroots portal, and the rest is left to GTK's portals.
[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=tde;gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
